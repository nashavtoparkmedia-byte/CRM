# Pinned Gradle distribution. The wrapper JAR is intentionally NOT committed:
# tools/bootstrap-gradle.sh downloads this exact distribution and verifies the
# published SHA-256 before use, which keeps a binary out of Git while still
# pinning the build toolchain.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
