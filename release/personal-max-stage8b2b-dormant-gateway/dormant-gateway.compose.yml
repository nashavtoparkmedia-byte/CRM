name: personal-max-stage8b2b

services:
  gateway:
    image: ghcr.io/nashavtoparkmedia-byte/crm-max-personal-gateway@sha256:669172fc4ac650e7bffa5c8095b812526f337c75c2811cde747d318d320eddd0
    pull_policy: never
    container_name: personal-max-dormant-gateway
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      MAX_RAW_JOURNAL_ENABLED: ""
      MAX_INBOUND_NORMALIZER_ENABLED: ""
      MAX_SHADOW_COMPARISON_ENABLED: ""
      MAX_PERSONAL_LIVE_CAPTURE_ENABLED: ""
      MAX_PERSONAL_GATEWAY_BIND_HOST: "0.0.0.0"
      MAX_PERSONAL_GATEWAY_PRIVATE_NETWORK: "required"
      MAX_PERSONAL_GATEWAY_PORT: "8080"
      MAX_PERSONAL_BROWSER_OWNERS_EXPECTED: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      - dormant
    ports: []
    volumes: []
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      personal-max.stage: "8b2b"
      personal-max.mode: "dormant"
      personal-max.lifecycle: "checksum-bound-compose"

networks:
  dormant:
    name: personal-max-stage8b2b-dormant
    internal: true
    labels:
      personal-max.stage: "8b2b"
      personal-max.mode: "dormant"
