# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — главный конфиг (минимальный скелет для PR 1)
#
# Реальные upstreams и server-блоки появятся в PR 2 (по сервису).
# Сейчас здесь — только базовая обвязка и health endpoint.
# ─────────────────────────────────────────────────────────────────────────────
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

events {
    worker_connections  2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логи в stdout/stderr — Docker подхватывает
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Большие загрузки — для медиа в мессенджерах
    client_max_body_size 64m;

    # gzip — стандартные текстовые типы
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Конфиги отдельных сайтов — каждый в своём файле
    include /etc/nginx/conf.d/*.conf;
}
