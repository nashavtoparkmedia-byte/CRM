# ─────────────────────────────────────────────────────────────────────────────
# default.conf — заглушка для PR 1
#
# Сейчас открыт только health endpoint и ACME-validation для Let's Encrypt.
# Реальные server-блоки CRM/бота/админки добавятся в PR 2.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt ACME challenge — webroot validation
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Health endpoint — для health-monitor.sh и uptime-чекеров
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Всё остальное на этапе PR 1 — 503 (нет апстримов)
    location / {
        return 503 "CRM services not deployed yet — PR 2 pending\n";
        add_header Content-Type text/plain;
    }
}
