# ─────────────────────────────────────────────────────────────────────────────
# CRM production stack — полный (PR 1 + PR 2)
#
# Инфраструктура (PR 1):
#   - postgres : основная база данных
#   - redis    : очередь задач + пароль из .env.production
#   - nginx    : единая входная точка из интернета (HTTPS, маршрутизация)
#
# Прикладные сервисы (PR 2):
#   - gravity-mvp                  (CRM Next.js 16, порт 3002)
#   - tg-bot                       (Telegram бот, polling)
#   - tg-bot-frontend              (Next.js 14 админка, порт 3004)
#   - yandex-fleet-scraper-api     (порт 3003)
#   - yandex-fleet-scraper-worker  (Playwright воркер)
#   - max-web-scraper              (Playwright скрапер MAX, без HTTP)
#
# Что НЕ в Docker (живёт на самом хосте):
#   - FreeSWITCH (телефонный SIP-стек)
#   - coturn (TURN relay)
#   - xray (SOCKS5 proxy)
#   Причина: эти три сервиса работают с UDP-пакетами голоса (RTP),
#   которые плохо проходят через виртуальную сеть Docker.
# ─────────────────────────────────────────────────────────────────────────────
name: crm

services:

  # ─── Postgres: основная база данных ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      # Чуть-чуть тюна под нашу нагрузку (100 водителей, ~30 connections)
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Папка для ручных импортов (например, восстановление из бэкапа)
      - ./postgres-import:/var/lib/postgresql/import:ro
    networks:
      - crm_internal
    # Postgres слушает только внутри Docker-сети — снаружи недоступен.
    # Это безопаснее: даже если кто-то подсмотрел пароль, он не подключится.
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Логи Postgres — ограничиваем размер, иначе сожрут диск со временем
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Redis: очередь задач BullMQ (transcribe + analyze) ──────────────────
  # AOF включён (everysec) — чтобы при рестарте Redis не потерять очередь.
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
      --appendonly yes
      --appendfsync everysec
      --save "300 1"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - crm_internal
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── MinIO: S3-совместимое хранилище для recordings звонков ──────────────
  # FreeSWITCH пишет MP3 в локальную папку, recording-upload-retry.js в
  # gravity-mvp загружает их в MinIO. Бэкапы (backup-files.sh) тянут из этого
  # же volume и отправляют в Selectel S3 как offsite-копию.
  minio:
    image: minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API — только loopback, наружу не выдаём
      - "127.0.0.1:9001:9001"   # MinIO console
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio_data:/data
    networks:
      - crm_internal
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO bucket init — одноразовое создание bucket'а recordings
  minio-init:
    image: minio/mc:latest
    container_name: crm-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - crm_internal
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb -p local/"$${MINIO_RECORDINGS_BUCKET:-recordings}" 2>/dev/null || true
        echo "MinIO bucket ready"
    environment:
      MINIO_ROOT_USER:          ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:      ${MINIO_ROOT_PASSWORD}
      MINIO_RECORDINGS_BUCKET:  ${MINIO_RECORDINGS_BUCKET:-recordings}

  # ─── FreeSWITCH: SIP-стек, дозвон через МегаФон, mod_audio_fork ──────────
  # Слушает SIP/UDP 5060, ESL 8021 (только loopback), RTP 16384-16484/UDP.
  # На VPS UDP NAT работает через explicit port mappings (Linux bridge mode).
  freeswitch:
    build:
      context: ../telephony
      dockerfile: Dockerfile
    image: crm/freeswitch:latest
    container_name: crm-freeswitch
    restart: unless-stopped
    ports:
      - "5060:5060/udp"             # internal SIP profile
      - "5060:5060/tcp"
      - "5080:5080/udp"             # external (МегаФон SBC)
      - "7080:7080/tcp"             # WebRTC WS
      - "16384-16484:16384-16484/udp"  # RTP media
      - "127.0.0.1:8021:8021/tcp"   # ESL — только loopback
    environment:
      MEGAFON_SIP_USERNAME: ${MEGAFON_SIP_USERNAME:?MEGAFON_SIP_USERNAME required}
      MEGAFON_SIP_PASSWORD: ${MEGAFON_SIP_PASSWORD:?MEGAFON_SIP_PASSWORD required}
      ESL_PASSWORD:         ${ESL_PASSWORD:-ClueCon}
      MANAGER_101_PASSWORD: ${MANAGER_101_PASSWORD:-changeme101}
      MANAGER_102_PASSWORD: ${MANAGER_102_PASSWORD:-changeme102}
      MANAGER_103_PASSWORD: ${MANAGER_103_PASSWORD:-changeme103}
      RTP_START_PORT: 16384
      RTP_END_PORT:   16484
      FREESWITCH_SIP_IP: ${FREESWITCH_SIP_IP:-0.0.0.0}
      FREESWITCH_EXT_IP: ${FREESWITCH_EXT_IP:-127.0.0.1}
    volumes:
      - freeswitch_recordings:/var/lib/freeswitch/recordings
      - freeswitch_logs:/var/log/freeswitch
    networks:
      - crm_internal
    depends_on:
      minio:
        condition: service_healthy
    # Stock /healthcheck.sh calls fs_cli with the default ClueCon password and
    # goes unhealthy once ESL_PASSWORD is a real secret. Override to pass the
    # password explicitly from env (falls back to ClueCon for local dev).
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -p \"$${ESL_PASSWORD:-ClueCon}\" -x status | grep -q ^UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── audio-bridge: WS-мост FreeSWITCH ↔ STT/LLM/TTS ──────────────────────
  # Принимает mod_audio_fork стримы от FreeSWITCH, прогоняет через
  # Yandex SpeechKit / OpenAI STT, формирует ответ через Anthropic Claude,
  # синтезирует TTS, отдаёт обратно в звонок.
  audio-bridge:
    build:
      context: ../tools/audio-bridge-day1
      dockerfile: Dockerfile
    image: crm/audio-bridge:latest
    container_name: crm-audio-bridge
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      AUDIO_BRIDGE_PORT: 3030
      # ESL — bridge подключается к FreeSWITCH по ESL для подписки на события
      FS_ESL_HOST: freeswitch
      FS_ESL_PORT: 8021
      ESL_PASSWORD: ${ESL_PASSWORD:-ClueCon}
      # CRM webhook — для finalize POST после окончания звонка
      CRM_BASE_URL: http://gravity-mvp:3002
    networks:
      - crm_internal
    depends_on:
      freeswitch:
        condition: service_started
      gravity-mvp:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Init: bootstrap self-signed SSL ─────────────────────────────────────
  # Без сертификата nginx падает на старте (SSL block в templates).
  # Этот одноразовый контейнер создаёт self-signed cert ДО старта nginx.
  # После scripts/get-ssl.sh реальный Let's Encrypt cert заменит self-signed
  # и nginx подхватит его через `nginx -s reload` (без downtime).
  certs-init:
    image: alpine:3.19
    container_name: crm-certs-init
    restart: "no"
    volumes:
      - nginx_certs:/etc/letsencrypt
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?CRM_DOMAIN required}
      BOT_ADMIN_DOMAIN: ${BOT_ADMIN_DOMAIN:?BOT_ADMIN_DOMAIN required}
      # Опциональные — для миграции на yokoone.ru.
      # Если не заданы — пропускаются (нет нужды генерить self-signed).
      # Default "_disabled_*" — nginx-блоки существуют, но server_name никогда
      # не сматчится, поэтому они инертны на старых установках без этих env.
      CRM_WWW_DOMAIN: ${CRM_WWW_DOMAIN:-_disabled_www_}
      CRM_APP_DOMAIN: ${CRM_APP_DOMAIN:-_disabled_app_}
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null
        for d in "$$CRM_DOMAIN" "$$BOT_ADMIN_DOMAIN" "$$CRM_APP_DOMAIN"; do
          [ -z "$$d" ] && continue
          cert_dir="/etc/letsencrypt/live/$$d"
          if [ -f "$$cert_dir/fullchain.pem" ]; then
            echo "[$$d] cert exists, skip"
            continue
          fi
          echo "[$$d] generating self-signed bootstrap cert (30 days)"
          mkdir -p "$$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
            -keyout "$$cert_dir/privkey.pem" \
            -out "$$cert_dir/fullchain.pem" \
            -subj "/CN=$$d" 2>/dev/null
        done
        # Для www nginx использует тот же cert что и apex (SAN), отдельный
        # bootstrap не нужен.
        echo "Done."

  # ─── Nginx: входная точка из интернета ───────────────────────────────────
  # Принимает все HTTPS-запросы и направляет в нужный сервис:
  #   crm.example.ru          → gravity-mvp:3002
  #   bot-admin.example.ru    → tg-bot-frontend:3004
  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP — Let's Encrypt validation + 301 на HTTPS
      - "443:443"   # HTTPS — основной
    volumes:
      # conf.d — записываемая, потому что nginx entrypoint envsubst пишет сюда
      # processed templates (NGINX_ENVSUBST_OUTPUT_DIR). default.conf оставляем
      # rebindable из репо — но без :ro чтобы entrypoint не падал.
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Templates — read-only, envsubst читает их и кладёт обработанный
      # результат в /etc/nginx/conf.d/
      - ./nginx/templates:/etc/nginx/templates:ro
      - nginx_certs:/etc/letsencrypt
      - nginx_www:/var/www/letsencrypt
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?CRM_DOMAIN required}
      BOT_ADMIN_DOMAIN: ${BOT_ADMIN_DOMAIN:?BOT_ADMIN_DOMAIN required}
      # Для миграции на yokoone.ru — crm.conf.template использует эти имена.
      # Если пусто — envsubst подставит пустую строку, что превратит
      # `server_name ${CRM_DOMAIN} ${CRM_WWW_DOMAIN} ${CRM_APP_DOMAIN};` в
      # валидный директив с одним именем.
      # Default "_disabled_*" — nginx-блоки существуют, но server_name никогда
      # не сматчится, поэтому они инертны на старых установках без этих env.
      CRM_WWW_DOMAIN: ${CRM_WWW_DOMAIN:-_disabled_www_}
      CRM_APP_DOMAIN: ${CRM_APP_DOMAIN:-_disabled_app_}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    networks:
      - crm_internal
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── gravity-mvp: CRM Next.js (фронт + бэк) ─────────────────────────────
  gravity-mvp:
    build:
      context: ../gravity-mvp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AVITO_LEADS_URL: ${NEXT_PUBLIC_AVITO_LEADS_URL:-}
        NEXT_PUBLIC_MAX_SCRAPER_PHONE: ${NEXT_PUBLIC_MAX_SCRAPER_PHONE:-}
        NEXT_PUBLIC_FORCE_SHOW_ALL_CHANNELS: ${NEXT_PUBLIC_FORCE_SHOW_ALL_CHANNELS:-}
    image: crm/gravity-mvp:latest
    container_name: crm-gravity-mvp
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      # whatsapp-web.js LocalAuth dir → persistent volume (see below). Без этого
      # сессия писалась в node_modules/.wwebjs_auth внутри образа и стиралась при
      # каждом редеплое → WA-подключение слетало. Должен совпадать с mount ниже.
      WA_AUTH_PATH: /app/whatsapp_auth
    volumes:
      # Записи звонков и медиа — write-through в S3, но локальный кэш нужен
      - gravity_recordings:/app/recordings
      # Сессия WhatsApp (wwebjs LocalAuth) — отдельный volume для долгоживущей сессии
      - gravity_whatsapp:/app/whatsapp_auth
    networks:
      - crm_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── tg-bot: Telegram бот водителей (polling) ───────────────────────────
  tg-bot:
    build:
      context: ../tg-bot
      dockerfile: Dockerfile
    image: crm/tg-bot:latest
    container_name: crm-tg-bot
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      # gravity-mvp callbacks — через внутреннюю сеть
      CRM_WEBHOOK_URL: http://gravity-mvp:3002
    networks:
      - crm_internal
    depends_on:
      postgres:
        condition: service_healthy
      gravity-mvp:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── tg-bot-frontend: админка опросов (Next.js 14) ──────────────────────
  tg-bot-frontend:
    build:
      context: ../tg-bot/tg-bot-frontend
      dockerfile: Dockerfile
    image: crm/tg-bot-frontend:latest
    container_name: crm-tg-bot-frontend
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      PORT: 3004
      TG_BOT_API_URL: http://tg-bot:3001
    networks:
      - crm_internal
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── yandex-fleet-scraper-api: HTTP API скрапера ────────────────────────
  # ВАЖНО: yandex-fleet-scraper использует SQLite (provider="sqlite" в schema.prisma).
  # DATABASE_URL = file:/app/data/dev.db — абсолютный путь в персистентный volume.
  # API и worker делят один volume yfs_db, чтобы видеть одни и те же аккаунты.
  yandex-fleet-scraper-api:
    build:
      context: ../yandex-fleet-scraper
      dockerfile: Dockerfile
    image: crm/yandex-fleet-scraper:latest
    container_name: crm-yfs-api
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CRM_WEBHOOK_URL: http://gravity-mvp:3002
      PORT: 3003
    # yandex-fleet-scraper не имеет migrations/ — используем db push для создания
    # схемы из schema.prisma. Идемпотентно: применяется только если есть diff.
    command: ["sh", "-c", "mkdir -p /app/data && npx prisma db push --skip-generate --accept-data-loss=false && npm run start:api"]
    volumes:
      - yfs_db:/app/data
    networks:
      - crm_internal
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── yandex-fleet-scraper-worker: Playwright воркер ─────────────────────
  yandex-fleet-scraper-worker:
    # Используем тот же image что и api — собирается один раз
    image: crm/yandex-fleet-scraper:latest
    container_name: crm-yfs-worker
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CRM_WEBHOOK_URL: http://gravity-mvp:3002
      PLAYWRIGHT_HEADLESS: "true"
    command: ["npm", "run", "start:worker"]
    volumes:
      # SQLite БД — общий с api
      - yfs_db:/app/data
      # Профиль браузера fleet.yandex.ru — критично сохранять между рестартами
      - yfs_chrome_profile:/app/.bot_profile
    networks:
      - crm_internal
    depends_on:
      yandex-fleet-scraper-api:
        condition: service_started
      redis:
        condition: service_healthy
    # У worker'а нет HTTP-порта — кастомный healthcheck по процессу
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx.*worker' >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── max-web-scraper: Playwright скрапер MAX ────────────────────────────
  max-web-scraper:
    build:
      context: ../max-web-scraper
      dockerfile: Dockerfile
    image: crm/max-web-scraper:latest
    container_name: crm-max-scraper
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      # ВАЖНО: путь /api/webhooks/max обязателен — forwardToWebhook шлёт POST
      # ровно на этот URL. Без пути сообщения уходят на / (домашняя страница,
      # 200 OK) и молча теряются — в БД не попадает ни одного MAX-сообщения.
      CRM_WEBHOOK_URL: http://gravity-mvp:3002/api/webhooks/max
    volumes:
      # Сессия web.max.ru. ВАЖНО: путь должен совпадать с USER_DATA_DIR в
      # index.js (= /app/user_data, через __dirname). Раньше монтировалось в
      # /app/userData (camelCase) — playwright-профиль писался в /app/user_data
      # (ephemeral слой), volume оставался пустым, и MAX требовал скан QR после
      # каждого пересоздания контейнера. Тот же класс бага, что чинили для WA.
      - max_user_data:/app/user_data
    networks:
      - crm_internal
    depends_on:
      gravity-mvp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*index' >/dev/null"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# ─── Volumes: места где хранятся данные между перезапусками ──────────────
# Это как "флешки" которые остаются даже если контейнер пересоздать.
volumes:
  postgres_data:
    name: crm_postgres_data
  redis_data:
    name: crm_redis_data
  nginx_certs:
    name: crm_nginx_certs
  nginx_www:
    name: crm_nginx_www
  gravity_recordings:
    name: crm_gravity_recordings
  gravity_whatsapp:
    name: crm_gravity_whatsapp
  yfs_db:
    name: crm_yfs_db
  yfs_chrome_profile:
    name: crm_yfs_chrome_profile
  yfs_chrome_user_data:
    name: crm_yfs_chrome_user_data
  max_user_data:
    name: crm_max_user_data
  minio_data:
    name: crm_minio_data
  freeswitch_recordings:
    name: crm_freeswitch_recordings
  freeswitch_logs:
    name: crm_freeswitch_logs

# ─── Networks: внутренняя сеть между контейнерами ───────────────────────
# Postgres, Redis и приложения видят друг друга по имени (postgres, redis),
# но извне эта сеть недоступна — только через nginx на портах 80/443.
networks:
  crm_internal:
    name: crm_internal
    driver: bridge
