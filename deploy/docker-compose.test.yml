# Test override — переопределяет имена контейнеров, чтобы локальный smoke-тест
# не конфликтовал с боевыми crm-redis / crm-freeswitch (telephony).
# Применять только вместе с базовым compose:
#   docker compose -p crm-test --env-file .env.production \
#     -f deploy/docker-compose.production.yml \
#     -f deploy/docker-compose.test.yml \
#     up -d postgres redis nginx
name: crm-test

services:
  postgres:
    container_name: crm-test-postgres
  redis:
    container_name: crm-test-redis
  nginx:
    container_name: crm-test-nginx
    # На время теста не занимаем 80/443 — могут быть заняты другим nginx
    ports:
      - "18080:80"
      - "18443:443"

volumes:
  postgres_data:
    name: crm_test_postgres_data
  redis_data:
    name: crm_test_redis_data
  nginx_certs:
    name: crm_test_nginx_certs
  nginx_www:
    name: crm_test_nginx_www

networks:
  crm_internal:
    name: crm_test_internal
