listening-port=3478
listening-ip=127.0.0.1
relay-ip=127.0.0.1
realm=crm.local
lt-cred-mech
user=crm:turnpass
fingerprint
# Allow TURN clients to send to loopback peers — required because
# FreeSWITCH (the SIP peer) listens on 127.0.0.1 in the same WSL2 host.
# Coturn's default policy hard-blocks loopback peers (compile-time); this
# flag overrides the deny list so 127.0.0.0/8 is reachable.
allow-loopback-peers
no-cli
no-tls
no-dtls
verbose
log-file=/var/log/turnserver.log
min-port=49152
max-port=65535
