name: Runtime v10 exact artifact transfer c4bc5d62

on:
  push:
    branches:
      - codex/runtime-v10-artifact-transfer-c4bc5d62

permissions:
  contents: write
  actions: read

concurrency:
  group: runtime-v10-artifact-transfer-c4bc5d62
  cancel-in-progress: true

jobs:
  split-exact-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out transfer locator branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/runtime-v10-artifact-transfer-result-c4bc5d62
          fetch-depth: 1

      - name: Download and verify exact accepted artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p chunks
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output gravity-image-c4bc5d62.zip \
            https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/9629390637/zip
          test "$(stat -c %s gravity-image-c4bc5d62.zip)" = 2521188478
          printf '%s  %s\n' \
            ff10f9bfad5034bfa3a0d8e419b6c7f8d2a32532ef8826e45d6324a3a99eca51 \
            gravity-image-c4bc5d62.zip | sha256sum --check --strict
          split --bytes=400000000 --numeric-suffixes=0 --suffix-length=2 \
            gravity-image-c4bc5d62.zip chunks/part-
          test "$(find chunks -maxdepth 1 -type f -name 'part-*' | wc -l)" = 7
          for suffix in 00 01 02 03 04 05 06; do
            test -s "chunks/part-$suffix"
          done
          sha256sum chunks/part-* > chunks/SHA256SUMS
          cat chunks/part-* | sha256sum --check --strict <(printf '%s  -\n' ff10f9bfad5034bfa3a0d8e419b6c7f8d2a32532ef8826e45d6324a3a99eca51)

      - name: Upload transfer manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-manifest
          path: chunks/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-part-00
          path: chunks/part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-part-01
          path: chunks/part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-part-02
          path: chunks/part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-part-03
          path: chunks/part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-part-04
          path: chunks/part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 05
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-part-05
          path: chunks/part-05
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 06
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-c4bc5d62-part-06
          path: chunks/part-06
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish exact run locator
        run: |
          set -Eeuo pipefail
          mkdir -p .runtime-v10-transfer
          printf '{"run_id":%s,"run_attempt":%s,"workflow_sha":"%s","source_artifact_id":9629390637,"source_artifact_sha256":"ff10f9bfad5034bfa3a0d8e419b6c7f8d2a32532ef8826e45d6324a3a99eca51"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > .runtime-v10-transfer/c4bc5d62-run.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .runtime-v10-transfer/c4bc5d62-run.json
          git commit -m "ci: publish exact Runtime v10 transfer run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/codex/runtime-v10-artifact-transfer-result-c4bc5d62
