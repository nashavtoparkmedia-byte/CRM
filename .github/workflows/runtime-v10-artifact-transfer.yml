name: Runtime v10 exact artifact transfer 451c0ea4

on:
  push:
    branches:
      - codex/runtime-v10-artifact-transfer-451c0ea4

permissions:
  contents: write
  actions: read

concurrency:
  group: runtime-v10-artifact-transfer-451c0ea4
  cancel-in-progress: true

jobs:
  split-exact-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out transfer locator branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/runtime-v10-artifact-transfer-result-451c0ea4
          fetch-depth: 1

      - name: Download and verify exact accepted artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p chunks
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output gravity-image-451c0ea4.zip \
            https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/9401849671/zip
          test "$(stat -c %s gravity-image-451c0ea4.zip)" = 2521188478
          printf '%s  %s\n' \
            86b3a32f2affa7b580eef45fbb7e7116e957ee0e9c9cda26bc16e3eafd54a48d \
            gravity-image-451c0ea4.zip | sha256sum --check --strict
          split --bytes=400000000 --numeric-suffixes=0 --suffix-length=2 \
            gravity-image-451c0ea4.zip chunks/part-
          test "$(find chunks -maxdepth 1 -type f -name 'part-*' | wc -l)" = 7
          for suffix in 00 01 02 03 04 05 06; do
            test -s "chunks/part-$suffix"
          done
          sha256sum chunks/part-* > chunks/SHA256SUMS
          cat chunks/part-* | sha256sum --check --strict <(printf '%s  -\n' 86b3a32f2affa7b580eef45fbb7e7116e957ee0e9c9cda26bc16e3eafd54a48d)

      - name: Upload transfer manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-manifest
          path: chunks/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-part-00
          path: chunks/part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-part-01
          path: chunks/part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-part-02
          path: chunks/part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-part-03
          path: chunks/part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-part-04
          path: chunks/part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 05
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-part-05
          path: chunks/part-05
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload transfer part 06
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gravity-transfer-451c0ea4-part-06
          path: chunks/part-06
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish exact run locator
        run: |
          set -Eeuo pipefail
          mkdir -p .runtime-v10-transfer
          printf '{"run_id":%s,"run_attempt":%s,"workflow_sha":"%s","source_artifact_id":9401849671,"source_artifact_sha256":"86b3a32f2affa7b580eef45fbb7e7116e957ee0e9c9cda26bc16e3eafd54a48d"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > .runtime-v10-transfer/451c0ea4-run.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .runtime-v10-transfer/451c0ea4-run.json
          git commit -m "ci: publish exact Runtime v10 transfer run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/codex/runtime-v10-artifact-transfer-result-451c0ea4
