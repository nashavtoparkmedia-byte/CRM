name: Agent architecture contract

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .cursorrules
      - .claude/CLAUDE_BOOTSTRAP_PROMPT.md
      - docs/architecture/**
      - tools/check-agent-architecture-contract.mjs
      - tools/__tests__/check-agent-architecture-contract.test.mjs
      - .github/workflows/agent-architecture-contract.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .cursorrules
      - .claude/CLAUDE_BOOTSTRAP_PROMPT.md
      - docs/architecture/**
      - tools/check-agent-architecture-contract.mjs
      - tools/__tests__/check-agent-architecture-contract.test.mjs
      - .github/workflows/agent-architecture-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2

      - name: Verify canonical instructions and references
        run: node tools/check-agent-architecture-contract.mjs

      - name: Prove positive and fail-closed behavior
        run: node --test tools/__tests__/check-agent-architecture-contract.test.mjs
