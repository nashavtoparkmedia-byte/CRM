name: Architecture enforcement

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-enforcement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify runner Node.js
        run: |
          node --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 20) process.exit(1)"

      - name: Install locked test toolchain without lifecycle scripts
        run: |
          npm ci --prefix gravity-mvp --ignore-scripts --no-audit --no-fund
          npm ci --prefix tg-bot --ignore-scripts --no-audit --no-fund

      - name: Run authoritative architecture controls
        env:
          YOKO_BLAST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/architecture/run-authoritative-ci.mjs
