name: Coordinated Gravity + MAX c8ce34fe

on:
  push:
    branches:
      - codex/coordinated-gravity-max-c8ce34fe

permissions:
  contents: read
  actions: read

concurrency:
  group: coordinated-gravity-max-c8ce34fe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coordinated-artifact:
    outputs:
      release_artifact_id: ${{ steps.coordinated_upload.outputs.artifact-id }}
      release_artifact_digest: ${{ steps.coordinated_upload.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact release builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-authority

      - name: Check out fixed accepted application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c8ce34feae84e5674357df496be37d0cd8a457bb
          # Deep enough to resolve this candidate's own repair chain: the
          # candidate, its six repair commits, the repair base (HEAD~7) and the
          # repair base's parent. Everything below that is proved by the
          # accepted predecessor authority, so no deeper history is needed.
          fetch-depth: 12
          persist-credentials: false
          path: application-source

      # Read-only evidence: the accepted predecessor authority for the repair
      # base. Pinned to one immutable commit on a divergent builder line, which
      # is why it cannot come from application-source or the release-authority
      # checkout at any depth - it is not an ancestor of either.
      - name: Check out exact accepted predecessor authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 19b631bc1d7026c4b8fe43f0713a57ef216d2ed9
          fetch-depth: 1
          persist-credentials: false
          path: predecessor-authority

      - name: Assert dual source and builder authority
        env:
          EXPECTED_BUILDER_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/coordinated-gravity-max-c8ce34fe
          test "$(git -C release-authority rev-parse 'HEAD^{commit}')" = "$EXPECTED_BUILDER_COMMIT"
          test "$(git -C application-source rev-parse 'HEAD^{commit}')" = c8ce34feae84e5674357df496be37d0cd8a457bb
          test "$(git -C application-source rev-parse 'HEAD^{tree}')" = 6a1051c3fff1147090b7c3e37310e149a811ac80
          test "$(git -C application-source rev-parse 'HEAD:gravity-mvp')" = e611b4138bf263057d010a487a5106fc811b1fdf
          test "$(git -C application-source rev-parse 'HEAD:max-web-scraper')" = 44e64cdf9e77671875f0681cb483a5b660c84b8a
          # The repair delta, newest first. HEAD~7 is the repair base fb9fb30d:
          # the candidate whose production acceptance failed and was rolled
          # back on 2026-09-23. It is this delta's technical base only, never an
          # accepted release. Everything below it is proved by the accepted
          # predecessor authority, not restated here.
          test "$(git -C application-source rev-parse 'HEAD~1^{commit}')" = a9cceca3cfb51e517a0a85c5f9fd26564b8518dd
          test "$(git -C application-source rev-parse 'HEAD~2^{commit}')" = 606dcbeaa5ac597d7e161c14ab9133095d508e03
          test "$(git -C application-source rev-parse 'HEAD~3^{commit}')" = 7e5fb75f2e47888fac623a9f1bfd9cd68c1e0610
          test "$(git -C application-source rev-parse 'HEAD~4^{commit}')" = 0fb7421c622e82e8e34fac20dc483b5ea4966887
          test "$(git -C application-source rev-parse 'HEAD~5^{commit}')" = 7b2156763d3f3b19e593b7f8a552be9c6dd16ae1
          test "$(git -C application-source rev-parse 'HEAD~6^{commit}')" = 427fae1677dc1ba50a705f47035837e01bcdb606
          test "$(git -C application-source rev-parse 'HEAD~7^{commit}')" = fb9fb30d9eb221a04342fe0ef7324f78d8ff7576
          builder_tree=$(git -C release-authority rev-parse 'HEAD^{tree}')
          printf 'RELEASE_BUILDER_COMMIT=%s\n' "$EXPECTED_BUILDER_COMMIT" >> "$GITHUB_ENV"
          printf 'RELEASE_BUILDER_TREE=%s\n' "$builder_tree" >> "$GITHUB_ENV"

      - name: Download exact accepted source execution proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10861950505'
          path: source-authority
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: nashavtoparkmedia-byte/CRM
          run-id: '36112089398'

      - name: Download exact accepted baseline execution proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10411840982'
          path: baseline-authority
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: nashavtoparkmedia-byte/CRM
          run-id: '34984925377'

      - name: Capture exact public source authority identities
        run: |
          set -Eeuo pipefail
          test -f source-authority/authoritative-ci-execution.json
          test "$(find baseline-authority -mindepth 1 -printf '%P\n')" = authoritative-ci-execution.json
          mv baseline-authority/authoritative-ci-execution.json source-authority/baseline-authoritative-ci-execution.json
          rmdir baseline-authority
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/runs/36112089398 \
            --output source-authority/run.json
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/runs/36112089398/jobs?per_page=100' \
            --output source-authority/jobs.json
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/10861950505 \
            --output source-authority/artifact.json
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/runs/34984925377 \
            --output source-authority/baseline-run.json
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/runs/34984925377/jobs?per_page=100' \
            --output source-authority/baseline-jobs.json
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/10411840982 \
            --output source-authority/baseline-artifact.json

      - name: Set up one exact Buildx and BuildKit authority
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.30.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.25.2@sha256:72bda77240181301a0d5ee57d39fa58e4aabd7eff26f81bbf108088caf810f05

      - name: Build and probe both fixed-source component images
        env:
          NEXT_PUBLIC_AVITO_LEADS_URL: ''
          NEXT_PUBLIC_MAX_SCRAPER_PHONE: '+79221853150'
          NEXT_PUBLIC_FORCE_SHOW_ALL_CHANNELS: 'true'
        run: |
          set -Eeuo pipefail
          test "$(docker buildx version | awk '{print $2}')" = v0.30.1
          buildx_inspect=$(docker buildx inspect --bootstrap)
          test "$(printf '%s\n' "$buildx_inspect" | awk '$1 == "Driver:" { print $2 }')" = docker-container
          test "$(printf '%s\n' "$buildx_inspect" | awk '$1 == "BuildKit" && $2 == "version:" { print $3 }')" = v0.25.2

          gravity_image="yoko/crm-gravity-mvp:c8ce34feae84-${RELEASE_BUILDER_COMMIT}-coordinated-v1"
          max_image="yoko/crm-max-scraper:c8ce34feae84-${RELEASE_BUILDER_COMMIT}-coordinated-v1"
          mkdir release-output

          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg "NEXT_PUBLIC_AVITO_LEADS_URL=$NEXT_PUBLIC_AVITO_LEADS_URL" \
            --build-arg "NEXT_PUBLIC_MAX_SCRAPER_PHONE=$NEXT_PUBLIC_MAX_SCRAPER_PHONE" \
            --build-arg "NEXT_PUBLIC_FORCE_SHOW_ALL_CHANNELS=$NEXT_PUBLIC_FORCE_SHOW_ALL_CHANNELS" \
            --label org.opencontainers.image.revision=c8ce34feae84e5674357df496be37d0cd8a457bb \
            --label yoko.activation.profile=crm-c8ce34feae84-gravity-max-source-v1 \
            --tag "$gravity_image" \
            --load \
            --file application-source/gravity-mvp/Dockerfile \
            application-source/gravity-mvp

          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --label org.opencontainers.image.revision=c8ce34feae84e5674357df496be37d0cd8a457bb \
            --label yoko.activation.profile=crm-c8ce34feae84-gravity-max-source-v1 \
            --tag "$max_image" \
            --load \
            --file release-authority/architecture/recovery/control-plane/v2/hosted-artifacts/crm-c8ce34feae84-gravity-max-source-v1/build/max-scraper.Dockerfile \
            application-source/max-web-scraper

          docker image save --output release-output/gravity-image.docker.tar "$gravity_image"
          docker image save --output release-output/max-scraper-image.docker.tar "$max_image"
          probe_program=$(<release-authority/architecture/recovery/control-plane/v2/hosted-artifacts/crm-c8ce34feae84-gravity-max-source-v1/build/max-runtime-probe.js)
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint node \
            "$max_image" -e "$probe_program" > max-runtime-probe.json

      - name: Emit and independently verify coordinated attestations
        run: |
          set -Eeuo pipefail
          authority=release-authority/architecture/recovery/control-plane/v2/hosted-artifacts/crm-c8ce34feae84-gravity-max-source-v1
          python3 -I -B "$authority/build/emit-coordinated-release.py" \
            --application-source application-source \
            --builder-source release-authority \
            --artifact-directory release-output \
            --source-authority-evidence source-authority \
            --predecessor-authority predecessor-authority \
            --max-runtime-probe max-runtime-probe.json \
            --builder-commit "$RELEASE_BUILDER_COMMIT" \
            --builder-tree "$RELEASE_BUILDER_TREE"
          python3 -I -B "$authority/verify-coordinated-artifact.py" \
            --application-source application-source \
            --builder-source release-authority \
            --artifact-directory release-output \
            --source-authority-evidence source-authority \
            --predecessor-authority predecessor-authority \
            --builder-commit "$RELEASE_BUILDER_COMMIT" \
            --builder-tree "$RELEASE_BUILDER_TREE"

      - name: Upload one exact coordinated artifact
        id: coordinated_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-gravity-max-c8ce34feae84-${{ github.sha }}
          path: |
            release-output/gravity-image.docker.tar
            release-output/gravity-image-attestation.json
            release-output/max-scraper-image.docker.tar
            release-output/max-scraper-image-attestation.json
            release-output/coordinated-release-manifest.json
            release-output/authoritative-ci-execution.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          include-hidden-files: false
          overwrite: true

      - name: Record hosted coordinated artifact identity
        env:
          ARTIFACT_ID: ${{ steps.coordinated_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.coordinated_upload.outputs.artifact-digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "$ARTIFACT_ID"
          printf '%s\n' "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/$ARTIFACT_ID" \
            --output coordinated-artifact-identity.json
          python3 -I - "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$RELEASE_BUILDER_COMMIT" <<'PY'
          import json, pathlib, sys
          artifact_id, digest, builder = sys.argv[1:]
          value = json.loads(pathlib.Path('coordinated-artifact-identity.json').read_text(encoding='utf8'))
          expected_name = f'coordinated-gravity-max-c8ce34feae84-{builder}'
          if (
              value.get('id') != int(artifact_id)
              or value.get('name') != expected_name
              or value.get('digest') != f'sha256:{digest}'
              or value.get('expired') is not False
              or type(value.get('size_in_bytes')) is not int
              or value['size_in_bytes'] <= 0
          ):
              raise SystemExit('hosted coordinated artifact identity mismatch')
          print(json.dumps({
              'artifact_name': value['name'],
              'artifact_id': value['id'],
              'artifact_digest': value['digest'],
              'artifact_bytes': value['size_in_bytes'],
          }, sort_keys=True))
          PY

      - name: Publish exact release identities as public annotations
        env:
          ARTIFACT_ID: ${{ steps.coordinated_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.coordinated_upload.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          test -z "$(git -C application-source status --porcelain=v1 --untracked-files=all)"
          python3 -I - "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$RELEASE_BUILDER_COMMIT" "$RELEASE_BUILDER_TREE" <<'PY'
          import json, pathlib, subprocess, sys
          artifact_id, digest, builder, builder_tree = sys.argv[1:]
          manifest = json.loads(pathlib.Path('release-output/coordinated-release-manifest.json').read_text(encoding='utf8'))
          identity = json.loads(pathlib.Path('coordinated-artifact-identity.json').read_text(encoding='utf8'))
          source = pathlib.Path('application-source')
          def rev(value):
              return subprocess.run(['git', '-C', str(source), 'rev-parse', value], check=True, capture_output=True, text=True).stdout.strip()
          components = manifest['components']
          authority = manifest['source_authority']
          baseline = authority['baseline']
          rows = [
              ('source', f"commit={rev('HEAD^{commit}')} tree={rev('HEAD^{tree}')} gravity_subtree={rev('HEAD:gravity-mvp')} max_subtree={rev('HEAD:max-web-scraper')} clean=true"),
              ('builder', f'commit={builder} tree={builder_tree}'),
              ('source-authority', (
                  f"event={authority['run']['event']} run_id={authority['run']['id']} "
                  f"pull_request={authority['pull_request']['number']} "
                  f"base_ref={authority['pull_request']['base']['ref']} "
                  f"base_sha={authority['pull_request']['base']['sha']} "
                  f"base_is_repair_base_not_accepted={str(not authority['repair_base']['production_accepted']).lower()} "
                  f"blast_base={authority['execution_proof']['blast_base_commit']} "
                  f"proof_artifact_id={authority['proof_artifact']['id']} "
                  f"proof_artifact_digest={authority['proof_artifact']['digest']}"
              )),
              ('baseline-authority', (
                  f"event={baseline['run']['event']} branch={baseline['run']['branch']} "
                  f"commit={baseline['commit']} run_id={baseline['run']['id']} "
                  f"proof_artifact_id={baseline['proof_artifact']['id']} "
                  f"proof_artifact_digest={baseline['proof_artifact']['digest']}"
              )),
          ]
          for key, label in (('gravity', 'gravity'), ('max_scraper', 'max-scraper')):
              value = components[key]
              rows.append((label, (
                  f"image_id={value['image_id']} containerd_image_id={value['containerd_image_id']} "
                  f"archive_sha256={value['docker_archive']['sha256']} archive_bytes={value['docker_archive']['bytes']} "
                  f"reference={value['image_reference']}"
              )))
          rows.append(('artifact', f"id={identity['id']} name={identity['name']} digest={identity['digest']} bytes={identity['size_in_bytes']}"))
          if manifest['application']['commit'] != rev('HEAD^{commit}') or identity['id'] != int(artifact_id) or identity['digest'] != f'sha256:{digest}':
              raise SystemExit('public release identity mismatch')
          if (
              authority['pull_request']['base']['sha'] != manifest['source_authority']['repair_base']['commit']
              or authority['repair_base']['production_accepted'] is not False
              or baseline['commit'] == authority['pull_request']['base']['sha']
          ):
              raise SystemExit('public release lineage misrepresentation')
          for title, text in rows:
              print(f'::notice title=stage-a-{title}::{text}')
          PY

  authenticated-transport:
    needs: coordinated-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact release builder for transport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-authority

      - name: Assert exact transport builder authority
        env:
          EXPECTED_BUILDER_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/coordinated-gravity-max-c8ce34fe
          test "$(git -C release-authority rev-parse 'HEAD^{commit}')" = "$EXPECTED_BUILDER_COMMIT"
          printf 'RELEASE_BUILDER_COMMIT=%s\n' "$EXPECTED_BUILDER_COMMIT" >> "$GITHUB_ENV"

      - name: Capture exact authenticated release artifact identity
        env:
          ARTIFACT_ID: ${{ needs.coordinated-artifact.outputs.release_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.coordinated-artifact.outputs.release_artifact_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "$ARTIFACT_ID"
          printf '%s\n' "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/$ARTIFACT_ID" \
            --output coordinated-artifact-identity.json
          python3 -I - "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$RELEASE_BUILDER_COMMIT" "$GITHUB_RUN_ID" <<'PY'
          import json, pathlib, sys
          artifact_id, digest, builder, run_id = sys.argv[1:]
          value = json.loads(pathlib.Path('coordinated-artifact-identity.json').read_text(encoding='utf8'))
          workflow_run = value.get('workflow_run')
          if (
              value.get('id') != int(artifact_id)
              or value.get('name') != f'coordinated-gravity-max-c8ce34feae84-{builder}'
              or value.get('digest') != f'sha256:{digest}'
              or value.get('expired') is not False
              or type(value.get('size_in_bytes')) is not int
              or value['size_in_bytes'] <= 0
              or type(workflow_run) is not dict
              or workflow_run.get('id') != int(run_id)
              or workflow_run.get('head_branch') != 'codex/coordinated-gravity-max-c8ce34fe'
              or workflow_run.get('head_sha') != builder
          ):
              raise SystemExit('authenticated release artifact identity mismatch')
          PY

      - name: Prepare and verify bounded authenticated artifact transport
        env:
          ARTIFACT_ID: ${{ needs.coordinated-artifact.outputs.release_artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          authority=release-authority/architecture/recovery/control-plane/v2/hosted-artifacts/crm-c8ce34feae84-gravity-max-source-v1
          test -n "$ARTIFACT_ID"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/$ARTIFACT_ID/zip" \
            | python3 -I -B "$authority/build/chunk-hosted-artifact.py" \
                --identity coordinated-artifact-identity.json \
                --output-directory coordinated-transport \
                --builder-commit "$RELEASE_BUILDER_COMMIT" \
                --run-id "$GITHUB_RUN_ID"
          python3 -I -B "$authority/verify-artifact-transport.py" \
            --identity coordinated-artifact-identity.json \
            --transport-directory coordinated-transport \
            --builder-commit "$RELEASE_BUILDER_COMMIT" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload transport part 000
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-000
          path: coordinated-transport/coordinated-artifact.zip.part-000
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 001
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-001
          path: coordinated-transport/coordinated-artifact.zip.part-001
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 002
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-002
          path: coordinated-transport/coordinated-artifact.zip.part-002
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 003
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-003
          path: coordinated-transport/coordinated-artifact.zip.part-003
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 004
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-004
          path: coordinated-transport/coordinated-artifact.zip.part-004
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 005
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-005
          path: coordinated-transport/coordinated-artifact.zip.part-005
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 006
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-006
          path: coordinated-transport/coordinated-artifact.zip.part-006
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 007
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coordinated-transport-c8ce34feae84-${{ github.sha }}-part-007
          path: coordinated-transport/coordinated-artifact.zip.part-007
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload transport part 008
