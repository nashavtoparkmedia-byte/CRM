name: Runtime 14 qualified artifact transport

on:
  push:
    branches:
      - codex/runtime14-artifact-transport

permissions:
  actions: read
  contents: read

jobs:
  split-qualified-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download and verify exact qualified artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir transport
          cd transport
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/nashavtoparkmedia-byte/CRM/actions/artifacts/9705291266/zip" \
            -o qualified-artifact.zip
          printf '%s  %s\n' \
            '438fcfd7a3caf23b385649aa4c3010c50a879ffdadc1ce29b8e0fff9ea6163f7' \
            'qualified-artifact.zip' | sha256sum --check --strict
          split --bytes=400000000 --numeric-suffixes=0 --suffix-length=2 \
            qualified-artifact.zip qualified-artifact.part-
          test "$(find . -maxdepth 1 -type f -name 'qualified-artifact.part-*' | wc -l)" -eq 7
          sha256sum qualified-artifact.zip qualified-artifact.part-* > SHA256SUMS

      - name: Upload checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-manifest
          path: transport/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-part-00
          path: transport/qualified-artifact.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-part-01
          path: transport/qualified-artifact.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-part-02
          path: transport/qualified-artifact.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-part-03
          path: transport/qualified-artifact.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-part-04
          path: transport/qualified-artifact.part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload part 05
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-part-05
          path: transport/qualified-artifact.part-05
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload part 06
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime14-qualified-artifact-part-06
          path: transport/qualified-artifact.part-06
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
